---
# Give every host a Python current ansible-core can use, from the host's own repositories (the
# distribution's, Satellite or a mirror). Run this before any other play, or make the role the
# first thing in each play. Later plays in the same run reuse the interpreter it chose.
#   ansible-playbook -i inventory.ini examples/playbook.yml
- name: Give the hosts a usable Python
  hosts: all
  become: true
  # Gathering facts is a module, so on a host with no usable Python it would fail before the
  # role could install one. The role gathers them itself once the interpreter is set.
  gather_facts: false
  roles:
    - role: libre_devops.python

# Hosts without repositories: push the packages from the control node instead. Download them on
# a machine that matches the hosts, for RHEL 8 with
#   dnf install --downloadonly --downloaddir=files/rhel8-python python3.12
- name: Give hosts with no repositories a usable Python
  hosts: isolated_rhel8
  become: true
  gather_facts: false
  roles:
    - role: libre_devops.python
      vars:
        python_bootstrap_source: files
        python_bootstrap_files: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/files/rhel8-python/*.rpm') }}"

# Then whatever the applications need: uv, Python versions from uv and from the repositories,
# and venvs owned by the service accounts that use them.
- name: Set up Python for the applications
  hosts: app_servers
  become: true
  gather_facts: false
  roles:
    - role: libre_devops.python
      vars:
        python_versions:
          - "3.13"
          - version: "3.12"
            source: repos
        python_venvs:
          - path: /opt/reporting/venv
            python: "3.13"
            requirements: "{{ playbook_dir }}/files/reporting-requirements.txt"
            exact: true
            owner: reporting
